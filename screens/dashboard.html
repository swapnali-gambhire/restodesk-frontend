<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Restaurant</title>
<style>
  body { margin: 0; display: flex; font-family: Arial, sans-serif; }

  aside { width: 240px; min-height: 100vh; background: #1e293b; padding: 20px; }
  main { padding: 30px; }

  a { display: block; color: #ddd; text-decoration: none; padding: 10px; border-radius: 8px; }
  a:hover { background: rgba(255,255,255,.1); }

  /* hidden by default, shown when parent has class "open" */
  .sub { display: none; margin-left: 15px; border-left: 1px solid #555; padding-left: 8px; }
  .open > .sub { display: block; }

  /* status dots */
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; }
  .free { background: #22c55e; }
  .occupied { background: #ef4444; }
  .reserved { background: #f59e0b; }
</style>
</head>
<body>

<aside>
  <div id="overview">
    <a href="#" onclick="toggle('overview')">📊 Overview ▾</a>

    <div class="sub">
      <div id="tables">
        <a href="#" onclick="toggle('tables')">🪑 Tables ▾</a>

        <div class="sub">
          <a href="#" onclick="pick(1)"><span class="dot free"></span>Table 1</a>
          <a href="#" onclick="pick(2)"><span class="dot occupied"></span>Table 2</a>
          <a href="#" onclick="pick(3)"><span class="dot reserved"></span>Table 3</a>
          <a href="#" onclick="pick(4)"><span class="dot free"></span>Table 4</a>
        </div>
      </div>

      <a href="#">📋 Menu</a>
      <a href="#">🧾 Order</a>
      <a href="/reports.html">📈 Reports</a>
    </div>
  </div>

  <a href="/settings.html">⚙️ Settings</a>
</aside>

<main>
  <h1 id="title">Overview</h1>
</main>

<script>
  // open / close a menu
  function toggle(id) {
    document.getElementById(id).classList.toggle("open");
  }

  // click on a table
  function pick(number) {
    document.getElementById("title").innerText = "Table " + number;
  }
</script>

</body>
</html>
